name: Calix Vesper simulator

on:
  push:
    branches: [main, codex/vesper]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calix-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Check Canvas and LearningX sync fixtures
        run: node --test tests/CanvasSync.test.cjs

      - name: Build with Xcode
        id: build
        run: |
          xcodebuild -version
          xcodebuild -project Calix.xcodeproj -scheme Calix -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/Calix" \
            CODE_SIGNING_ALLOWED=NO build
          mkdir -p "$RUNNER_TEMP/calix-artifacts"
          ditto -c -k --keepParent "$RUNNER_TEMP/Calix/Build/Products/Debug-iphonesimulator/Calix.app" \
            "$RUNNER_TEMP/calix-artifacts/Calix-Vesper-Simulator.zip"

      - name: Launch on an iPhone simulator
        timeout-minutes: 10
        run: |
          app="$RUNNER_TEMP/Calix/Build/Products/Debug-iphonesimulator/Calix.app"
          device=$(xcrun simctl list devices available --json | jq -er '
            [.devices | to_entries[] | select(.key | contains(".iOS-"))
             | (.key | split(".iOS-")[1] | split("-") | map(tonumber)) as $runtime
             | .value[] | select(.name | startswith("iPhone")) | {name, udid, runtime: $runtime}]
            | sort_by([.name == "iPhone SE (3rd generation)", .runtime]) | last | .udid')
          echo "Selected simulator: $device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl launch "$device" "$bundle_id" -calix-smoke
          data=$(xcrun simctl get_app_container "$device" "$bundle_id" data)
          for attempt in {1..45}; do
            test ! -s "$data/Documents/calix-smoke.txt" || break
            sleep 1
          done
          cat "$data/Documents/calix-smoke.txt"
          grep -Fx 'PASS' "$data/Documents/calix-smoke.txt"
          cp "$data/Documents/calix-smoke.txt" "$RUNNER_TEMP/calix-artifacts/"
          xcrun simctl status_bar "$device" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState unplugged --batteryLevel 100 || true
          for page in home deadlines calendar courses more; do
            xcrun simctl terminate "$device" "$bundle_id" || true
            xcrun simctl launch "$device" "$bundle_id" -calix-screenshot "$page"
            sleep 3
            xcrun simctl io "$device" screenshot "$RUNNER_TEMP/calix-artifacts/Calix-$page.png"
          done

      - name: Upload simulator build and screenshot
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Calix-Vesper-Simulator
          path: ${{ runner.temp }}/calix-artifacts/
          if-no-files-found: error
          retention-days: 14
