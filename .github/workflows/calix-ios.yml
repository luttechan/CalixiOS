name: Calix Vesper simulator

on:
  push:
    branches: [main, codex/vesper, codex/vesper-next]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calix-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Check Canvas and LearningX sync fixtures
        run: node --test tests/CanvasSync.test.cjs

      - name: Build with Xcode
        id: build
        run: |
          xcodebuild -version
          xcodebuild -project Calix.xcodeproj -scheme Calix -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/Calix" \
            CODE_SIGNING_ALLOWED=NO build
          mkdir -p "$RUNNER_TEMP/calix-artifacts"

      - name: Validate sync and capture iPhone 13
        timeout-minutes: 10
        run: |
          app="$RUNNER_TEMP/Calix/Build/Products/Debug-iphonesimulator/Calix.app"
          runtime=$(xcrun simctl list runtimes --json | jq -er '
            [.runtimes[] | select(.isAvailable and (.identifier | contains(".iOS-")))]
            | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')
          device=$(xcrun simctl create "Calix iPhone 13" com.apple.CoreSimulator.SimDeviceType.iPhone-13 "$runtime")
          echo "iPhone 13: $device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl launch "$device" "$bundle_id" -calix-smoke
          data=$(xcrun simctl get_app_container "$device" "$bundle_id" data)
          for attempt in {1..45}; do
            test ! -s "$data/Documents/calix-smoke.txt" || break
            sleep 1
          done
          cat "$data/Documents/calix-smoke.txt"
          grep -Fx 'PASS' "$data/Documents/calix-smoke.txt"
          node tests/AuroraWire.fixture.cjs "$RUNNER_TEMP/aurora-fixture-link" &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            test ! -s "$RUNNER_TEMP/aurora-fixture-link" || break
            sleep 1
          done
          xcrun simctl terminate "$device" "$bundle_id"
          xcrun simctl launch "$device" "$bundle_id" -calix-link-wire "$(cat "$RUNNER_TEMP/aurora-fixture-link")"
          for attempt in {1..35}; do
            test ! -s "$data/Documents/calix-wire.txt" || break
            sleep 1
          done
          cat "$data/Documents/calix-wire.txt"
          grep -Fx 'PASS' "$data/Documents/calix-wire.txt"
          xcrun simctl status_bar "$device" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState unplugged --batteryLevel 100 || true
          index=0
          for page in home deadlines calendar courses timetable checklist grades study more aurora-link; do
            index=$((index + 1))
            xcrun simctl terminate "$device" "$bundle_id" || true
            xcrun simctl launch "$device" "$bundle_id" -calix-screenshot "$page"
            sleep 2
            number=$(printf '%02d' "$index")
            png="$RUNNER_TEMP/calix-artifacts/$number-$page.png"
            xcrun simctl io "$device" screenshot "$png"
            sips -g pixelWidth -g pixelHeight "$png" | grep -F 'pixelWidth: 1170'
            sips -g pixelWidth -g pixelHeight "$png" | grep -F 'pixelHeight: 2532'
          done
          test "$(find "$RUNNER_TEMP/calix-artifacts" -name '*.png' | wc -l | tr -d ' ')" = 10

      - name: Upload 10 iPhone 13 screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Calix-Vesper-iPhone-13
          path: ${{ runner.temp }}/calix-artifacts/
          if-no-files-found: error
          retention-days: 14
